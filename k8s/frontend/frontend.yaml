apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubevora-frontend
  namespace: kubevora
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubevora-frontend
  template:
    metadata:
      labels:
        app: kubevora-frontend
    spec:
      containers:
        - name: frontend
          image: kubevora-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kubevora-frontend
  namespace: kubevora
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30030
  selector:
    app: kubevora-frontend
